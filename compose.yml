services:
  app:
    build: .
    container_name: regsgpt-app
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/regsgpt.db
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/app/data
    networks:
      - regsgpt-net

volumes:
  sqlite_data:

networks:
  regsgpt-net:
    driver: bridge
